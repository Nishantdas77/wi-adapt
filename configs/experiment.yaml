# configs/experiment.yaml
# Every pipeline setting lives here. Change a value here, not in the code.
seed: 42

paths:
  splits: splits/captures.csv              # from make_splits.py
  intermediate: data/intermediate_csv      # common 256-column CSV per capture
  windows: data/windows                    # 150 x 256 float32 .npy windows
  windows_index: splits/windows_index.csv  # provenance: window -> capture
  reports: reports
  results: results
  models: models

room_a:
  # exact     : sign * mantissa * 2**exponent (true float value)
  # autoscale : each packet shifted by one power of two so values stay below 2048
  #             (public Nexmon convention; puts Room A on the same 0..2047 range as Room B)
  scale: autoscale
  # auto     : pick the order whose average spectrum shape matches Room B (development data only)
  # fftshift : low -> high frequency      stored : order as stored by Nexmon
  subcarrier_order: auto
  order_check_captures: 100

qc:
  drop_nonfinite_rows: true
  drop_all_zero_rows: true
  drop_consecutive_duplicates: true

window:
  length: 150
  min_shift: 50          # development windows start at least 50 rows apart
  max_dev_windows: 3     # per development capture (keeps the two rooms balanced)
  validation: center     # exactly one window from the middle of each validation capture

normalization:
  eps_rel: 0.001         # log(amp + eps_rel * window_mean): scale-free log

task1:
  window_lengths: [5, 10, 25, 50, 100, 150]
  C: 1.0
  router_variant: scale_free

task2:
  # encoder (1D ResNet-style CNN): 256 subcarriers in, 128-number embedding out
  width: 128
  embed_dim: 128
  proj_dim: 64              # projection head, used only during SimCLR training
  # SimCLR training (development captures only, no labels)
  epochs: 120
  batch_size: 256
  lr: 0.001
  weight_decay: 0.0001
  temperature: 0.15
  num_threads: 0            # CPU threads for PyTorch, 0 = PyTorch default
  samples_per_capture: 3    # random segments per development capture per epoch -> every capture counts equally
  neighbor_max_gap: 40      # the 2 views come from 2 segments of the SAME capture at most 40 rows apart (0 = same rows)
  time_warp: [0.85, 1.15]   # random speed change of each view (1.0 = none)
  augment:
    crop_len: 120           # each view: 120 rows read at a random speed
    time_mask_max: 15       # blank up to 15 rows
    sub_mask_max: 16        # blank up to 16 neighbouring subcarriers
    noise_std: 0.05
    scale_range: [0.9, 1.1]
    # time reversal is deliberately NOT used: SITDOWN reversed looks like STANDUP
  # evaluation
  probe_C: 1.0              # logistic regression (official linear probe)
  knn_k: 10                 # k-NN probe (extra)

task3:
  feature_sets: [simclr, random, handcrafted]   # SSL contribution: trained encoder vs untrained vs no network
  main_features: simclr
  K_values: [1, 5, 10, 20]
  n_seeds: 5                 # different support picks per K (picks are nested: K=1 is inside K=5 ...)
  normalization: zscore      # per-room standardization of features, fitted on that room's DEV windows, no labels
  temperature: 0.1           # softmax temperature that turns similarities into a confidence
  self_training:             # extra: refine prototypes with confident pseudo-labels on TARGET DEV windows
    rounds: 3
    top_fraction: 0.3